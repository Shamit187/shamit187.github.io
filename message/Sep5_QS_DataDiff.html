  <!-- Embedded viz.js -->
  <script>
  // viz.js — Tidy Tree, starts collapsed to only the root.
  // Interactions:
  //  • Click node (no movement) to expand/collapse
  //  • Drag node (hold+move) to pan canvas (zoom transform updates)
  //  • Scroll to zoom
  //  • Edge labels: EDGE_LABEL_MODE = "onClick" | "always" | "never"

  (async function () {
    // -------- Config --------
    const EDGE_LABEL_MODE = "always";  // "onClick" | "always" | "never"
    const DX = 100;                    // vertical spacing between rows
    const DY = 280;                    // horizontal spacing per depth
    const ZOOM_MIN = 0.3;
    const ZOOM_MAX = 2.5;
    const DRAG_THRESHOLD = 4;          // px before it's considered a drag

    // -------- Load data from embedded <script id="tree-data"> --------
    let data;
    try {
      const raw = document.getElementById("tree-data")?.textContent || "{}";
      data = JSON.parse(raw);
    } catch (e) {
      console.error("Failed to parse embedded JSON:", e);
      const c = document.getElementById("container");
      if (c) c.innerHTML = '<div style="padding:16px;color:#b91c1c;font-weight:600">Failed to parse embedded tree data.</div>';
      return;
    }

    // -------- Full-window SVG --------
    const container = d3.select("#container");
    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = container.append("svg")
      .attr("width", "100%")
      .attr("height", "100%")
      .attr("viewBox", [0, 0, width, height])
      .style("width", "100vw")
      .style("height", "100vh")
      .style("font", "12px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif");

    const gZoom = svg.append("g");

    // Big background to capture pan/zoom drags
    gZoom.append("rect")
      .attr("x", -10000).attr("y", -10000)
      .attr("width", 20000).attr("height", 20000)
      .attr("fill", "transparent")
      .style("cursor", "grab");

    const gLinks = gZoom.append("g").attr("class", "links");
    const gLinkLabels = gZoom.append("g").attr("class", "link-labels");
    const gNodes = gZoom.append("g").attr("class", "nodes");

    // -------- Zoom/pan --------
    let currentTransform = d3.zoomIdentity;
    const zoom = d3.zoom()
      .scaleExtent([ZOOM_MIN, ZOOM_MAX])
      .on("zoom", (event) => {
        currentTransform = event.transform;
        gZoom.attr("transform", currentTransform);
      });
    svg.call(zoom);

    // -------- Build hierarchy & layout --------
    const root = d3.hierarchy(data);
    // Stable order by id
    root.sort((a, b) => d3.ascending(a.data.id, b.data.id));

    // Collapse helper (recursive)
    function collapse(d) {
      if (d.children) {
        d._children = d.children;
        d._children.forEach(collapse);
        d.children = null;
      }
    }
    // *** Start with ONLY the root visible ***
    collapse(root);

    const tree = d3.tree().nodeSize([DX, DY]);
    const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);

    // -------- Edge label toggle state (for "onClick" mode) --------
    // key = link target id, value = boolean visible
    const showEdgeLabels = new Map();

    // -------- Drag behavior on nodes (pans canvas) --------
    let dragMoved = false;
    const nodeDrag = d3.drag()
      .on("start", (event, d) => {
        dragMoved = false;
        event.sourceEvent.stopPropagation();
        d.__dragStart = { x: event.x, y: event.y };
      })
      .on("drag", (event, d) => {
        const dx = event.dx, dy = event.dy;
        if (!dragMoved) {
          const sx = d.__dragStart?.x ?? event.x;
          const sy = d.__dragStart?.y ?? event.y;
          if (Math.hypot(event.x - sx, event.y - sy) < DRAG_THRESHOLD) return;
          dragMoved = true;
        }
        const t = currentTransform.translate(dx, dy);
        currentTransform = t;
        gZoom.attr("transform", t);
      });

    function update(source) {
      tree(root);

      // ----- Links -----
      const links = root.links();
      const linkSel = gLinks.selectAll("path.link").data(links, d => d.target.data.id);

      const linkEnter = linkSel.enter().append("path")
        .attr("class", "link")
        .attr("fill", "none")
        .attr("stroke", "#9ca3af")
        .attr("stroke-width", 1.4)
        // start collapsed animation from source
        .attr("d", d => diagonal({ source: source, target: source }))
        // Allow clicking edges when in onClick mode
        .style("cursor", EDGE_LABEL_MODE === "onClick" ? "pointer" : "default")
        .on("click", (event, d) => {
          if (EDGE_LABEL_MODE !== "onClick") return;
          event.stopPropagation(); // don't trigger zoom
          const key = d.target.data.id;
          showEdgeLabels.set(key, !showEdgeLabels.get(key));
          renderLinkLabels(); // re-render labels only
        });

      linkSel.merge(linkEnter)
        .transition().duration(250)
        .attr("d", diagonal);

      linkSel.exit()
        .transition().duration(250)
        .attr("d", d => diagonal({ source: source, target: source }))
        .remove();

      // ----- Link labels (separated so we can re-render cheaply) -----
      function labelData() {
        if (EDGE_LABEL_MODE === "never") return [];
        if (EDGE_LABEL_MODE === "always") return links;
        // onClick mode → only those toggled on
        return links.filter(d => showEdgeLabels.get(d.target.data.id));
      }

      function midpoint(d) { return { x: (d.source.x + d.target.x) / 2, y: (d.source.y + d.target.y) / 2 }; }

      function renderLinkLabels() {
        const ll = gLinkLabels.selectAll("text.link-label").data(labelData(), d => d.target.data.id);

        const llEnter = ll.enter().append("text")
          .attr("class", "link-label")
          .attr("text-anchor", "middle")
          .attr("dy", -4)
          .style("font-size", "11px")
          .style("fill", "#374151")
          .style("paint-order", "stroke")
          .style("stroke", "#ffffff")
          .style("stroke-width", "4px")
          .style("stroke-linejoin", "round")
          .style("pointer-events", "none")
          .text(d => d.target.data.edge_label || "")
          .attr("x", d => midpoint(d).y)
          .attr("y", d => midpoint(d).x);

        ll.merge(llEnter)
          .transition().duration(250)
          .attr("x", d => midpoint(d).y)
          .attr("y", d => midpoint(d).x)
          .text(d => d.target.data.edge_label || "");

        ll.exit().remove();
      }

      renderLinkLabels(); // initial render / refresh

      // ----- Nodes -----
      const nodeSel = gNodes.selectAll("g.node").data(root.descendants(), d => d.data.id);

      const nodeEnter = nodeSel.enter().append("g")
        .attr("class", d => "node " + (d.children || d._children ? "split" : "leaf"))
        // start at source position for smooth enter transition
        .attr("transform", d => `translate(${source.y || 0},${source.x || 0})`)
        .on("click", (event, d) => {
          if (dragMoved) return;  // avoid toggling after drag
          event.stopPropagation();
          if (d.children) { d._children = d.children; d.children = null; }
          else { d.children = d._children; d._children = null; }
          update(d);
        })
        .call(nodeDrag);

      // Larger hit area for reliable interaction
      nodeEnter.append("rect")
        .attr("x", -10).attr("y", -16)
        .attr("width", 560).attr("height", 40)
        .attr("fill", "transparent")
        .style("pointer-events", "all");

      nodeEnter.append("circle")
        .attr("r", 6)  // slightly bigger default than 4
        .attr("fill", d => (d.children || d._children) ? "#555" : "#999")
        .attr("stroke", "#333")
        .attr("stroke-width", 1)
        .on("mouseover", function () {
          d3.select(this).transition().duration(150).attr("r", 10);  // expand on hover
        })
        .on("mouseout", function () {
          d3.select(this).transition().duration(150).attr("r", 6);   // shrink back
        });

      // Title: Split attr / Leaf / root
      nodeEnter.append("text")
        .attr("dy", "0.31em")
        .attr("x", d => (d.children || d._children) ? -8 : 8)
        .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
        .text(d => d.data.is_leaf ? `Leaf: ${d.data.equation}` : (d.data.split_attr ? `Split: ${d.data.split_attr}` : "(node)"))
        .attr("stroke", "white")
        .attr("paint-order", "stroke");

      const nodeUpdate = nodeEnter.merge(nodeSel);
      nodeUpdate.transition().duration(250)
        .attr("transform", d => `translate(${d.y || 0},${d.x || 0})`);

      nodeSel.exit()
        .transition().duration(250)
        .attr("transform", d => `translate(${source.y || 0},${source.x || 0})`)
        .remove();
    }

    // Initial render: only root is visible (everything else is in _children)
    update(root);

    // ---- Center the root node in the viewport ----
    const rootX = root.x || 0;
    const rootY = root.y || 0;
    const initialX = width / 2 - rootY;
    const initialY = height / 2 - rootX;
    const initialTransform = d3.zoomIdentity.translate(initialX, initialY);
    gZoom.attr("transform", initialTransform);
    svg.call(zoom.transform, initialTransform);
  })();
  </script>
